<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshops - ABACUS'26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">ABACUS'26<br><span class="nav-tagline">// WORKSHOPS</span></div>
            <ul class="nav-menu">
                <li><a href="../events/index.html" class="nav-link">Events</a></li>
                <li><a href="./index.html" class="nav-link active">Workshops</a></li>
                <li><a href="../accommodation/index.html" class="nav-link">Accommodation</a></li>
                <li><a href="../profile/index.html" class="nav-link">Profile</a></li>
                <li><a href="../logout/index.html" class="nav-link logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2>Workshop Sessions</h2>
            <p>Browse workshop details using Previous and Next</p>
            <button class="connected-btn">Connected</button>
        </div>

        <h1>Workshops</h1>

        <div class="workshop-card">
            <h3 id="workshopName">Workshop Name</h3>

            <div class="workshop-details">
                <div class="detail-row">
                    <span class="detail-label">Time</span>
                    <span class="detail-value" id="workshopTime">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Speaker</span>
                    <span class="detail-value" id="workshopSpeaker">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Date</span>
                    <span class="detail-value" id="workshopDate">--</span>
                </div>
            </div>

            <div class="workshop-nav">
                <!-- TODO: HTML TASK
                     Add two buttons inside this div:
                     1) Previous button with id="prevWorkshopBtn"
                     2) Next button with id="nextWorkshopBtn"
                -->
            </div>

            <p id="workshopIndex" class="workshop-index">1 / 1</p>
        </div>
    </div>

    <a href="../index.html" class="back-link">Back</a>
    <script src="script.js"></script>
</body>
</html>
