<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - ABACUS'26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">ABACUS'26<br><span class="nav-tagline">// REGISTRATION</span></div>
            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="../events/index.html" class="nav-link">Events</a></li>
                <li><a href="../workshops/index.html" class="nav-link">Workshops</a></li>
                <li><a href="../accommodation/index.html" class="nav-link">Accommodation</a></li>
                <li><a href="../profile/index.html" class="nav-link">Profile</a></li>
                <li><a href="../leaderboard/index.html" class="nav-link">Leaderboard</a></li>
                <li><a href="../index.html" class="nav-link logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <h2>Event Registration</h2>
            <p>Complete your registration for ABACUS'26</p>
            <button class="connected-btn">✓ Connected</button>
        </div>

        <div class="registration-form">
            <div class="form-group">
                <label for="name">Team Name:</label>
                <input type="text" id="name" placeholder="Enter team name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label for="ticketType">Ticket Type:</label>
                <select id="ticketType">
                    <option value="early">Early Bird - $30</option>
                    <option value="regular">Regular - $50</option>
                    <option value="late">Late - $70</option>
                </select>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="accommodation"> Add Accommodation (+$60)
                </label>
            </div>

            <div class="price-display">
                <strong>Total: $<span id="totalPrice">30</span></strong>
            </div>

            <button class="submit-btn" onclick="submitRegistration()">Register</button>
        </div>

        <div class="registration-status" id="confirmationSection" style="display: none;">
            <h2>✅ Registration Confirmed!</h2>
            <div class="confirmation-details">
                <p><strong>Registration ID:</strong> <span id="registrationId"></span></p>
                <p><strong>Team:</strong> <span id="confirmName"></span></p>
                <p><strong>Email:</strong> <span id="confirmEmail"></span></p>
                <p><strong>Ticket Type:</strong> <span id="confirmTicket"></span></p>
                <p><strong>Total:</strong> $<span id="confirmTotal"></span></p>
            </div>
        </div>
    </div>

    <a href="../index.html" class="back-link">← Back to Home</a>
    <script src="script.js"></script>
</body>
</html>    <script src="script.js"></script>
</body>
</html>
