<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABACUS'26 - Team Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #D4AF37;
      border-radius: 15px;
      padding: 50px 40px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
      border-bottom: 2px solid #D4AF37;
      padding-bottom: 30px;
    }

    .logo {
      font-size: 48px;
      color: #D4AF37;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #999;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .icon {
      font-size: 60px;
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #D4AF37;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: #0f0f1e;
      border: 2px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }

    input::placeholder {
      color: #666;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      background: #1a1a2e;
    }

    .password-note {
      font-size: 12px;
      color: #999;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #D4AF37 0%, #c9a227 100%);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .error-message {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid #ff6b6b;
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .info-box {
      background: rgba(212, 175, 55, 0.1);
      border-left: 3px solid #D4AF37;
      padding: 15px;
      border-radius: 6px;
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
    }

    .team-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .team-item {
      background: #0f0f1e;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="icon">🎯</div>
      <div class="logo">ABACUS'26</div>
      <div class="tagline">Symposium Platform</div>
    </div>

    <form id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="teamId">Team ID *</label>
        <select id="teamId" name="teamId" required>
          <option value="">-- Select Your Team --</option>
          <option value="team1">Team 1</option>
          <option value="team2">Team 2</option>
          <option value="team3">Team 3</option>
          <option value="team4">Team 4</option>
          <option value="team5">Team 5</option>
          <option value="team6">Team 6</option>
          <option value="team7">Team 7</option>
          <option value="team8">Team 8</option>
          <option value="team9">Team 9</option>
          <option value="team10">Team 10</option>
          <option value="team11">Team 11</option>
          <option value="team12">Team 12</option>
          <option value="team13">Team 13</option>
          <option value="team14">Team 14</option>
          <option value="team15">Team 15</option>
          <option value="team16">Team 16</option>
          <option value="team17">Team 17</option>
          <option value="team18">Team 18</option>
          <option value="team19">Team 19</option>
          <option value="team20">Team 20</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter team password"
          required
        >
        <div class="password-note">💡 Password provided by organizers</div>
      </div>

      <button type="submit">🔓 Enter Symposium</button>
    </form>

    <div class="info-box">
      <strong>ℹ️ Team Assignment</strong><br>
      Each team has been assigned a unique ID (Team 1-20) and password. Enter your credentials to access the symposium platform.
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    // Simple team passwords (can be changed by organizers)
    const teamPasswords = {
      'team1': 'abacus2026',
      'team2': 'abacus2026',
      'team3': 'abacus2026',
      'team4': 'abacus2026',
      'team5': 'abacus2026',
      'team6': 'abacus2026',
      'team7': 'abacus2026',
      'team8': 'abacus2026',
      'team9': 'abacus2026',
      'team10': 'abacus2026',
      'team11': 'abacus2026',
      'team12': 'abacus2026',
      'team13': 'abacus2026',
      'team14': 'abacus2026',
      'team15': 'abacus2026',
      'team16': 'abacus2026',
      'team17': 'abacus2026',
      'team18': 'abacus2026',
      'team19': 'abacus2026',
      'team20': 'abacus2026'
    };

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const teamId = document.getElementById('teamId').value;
      const password = document.getElementById('password').value;

      errorMessage.classList.remove('show');
      errorMessage.textContent = '';

      // Validate password
      if (!teamPasswords[teamId] || teamPasswords[teamId] !== password) {
        errorMessage.textContent = '❌ Invalid Team ID or Password. Please try again.';
        errorMessage.classList.add('show');
        return;
      }

      // Save to session storage (index-specific keys)
      sessionStorage.setItem('indexTeamId', teamId);
      sessionStorage.setItem('indexLoggedIn', 'true');

      // Redirect to home
      window.location.href = 'index.html';
    });

    // Check if already logged in
    window.addEventListener('load', function() {
      if (sessionStorage.getItem('indexLoggedIn') === 'true') {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
