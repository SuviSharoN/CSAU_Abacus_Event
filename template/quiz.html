<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABACUS'26 - Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .quiz-container {
      max-width: 700px;
      margin: 0 auto;
    }

    .question-card {
      background: #1a1a2e;
      border: 2px solid #D4AF37;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 40px;
    }

    .question-number {
      color: #D4AF37;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .question-text {
      color: #e0e0e0;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .question-text pre {
      margin-top: 12px;
      background: #0f0f1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      color: #e0e0e0;
      font-size: 14px;
      white-space: pre-wrap;
      font-family: Consolas, Monaco, 'Courier New', monospace;
      overflow-x: auto;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      background: transparent;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 15px 20px;
      color: #e0e0e0;
      cursor: pointer;
      transition: all 0.3s;
      text-align: left;
      font-size: 15px;
    }

    .option:hover:not(:disabled) {
      border-color: #D4AF37;
      background-color: rgba(212, 175, 55, 0.1);
    }

    .option:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .option.correct {
      border-color: #51cf66;
      background-color: rgba(81, 207, 102, 0.2);
      color: #51cf66;
    }

    .option.incorrect {
      border-color: #ff6b6b;
      background-color: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    .question-progress {
      background: #0f0f1e;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 30px;
      border-left: 4px solid #D4AF37;
    }

    .progress-bar {
      background: #333;
      border-radius: 4px;
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #D4AF37, #ffc107);
      height: 100%;
      transition: width 0.3s;
    }

    .quiz-complete {
      text-align: center;
      padding: 40px 20px;
      background: #1a1a2e;
      border: 2px solid #D4AF37;
      border-radius: 10px;
      margin-top: 40px;
    }

    .quiz-complete h2 {
      color: #D4AF37;
      margin-bottom: 20px;
    }

    .quiz-complete p {
      color: #aaa;
      margin-bottom: 20px;
    }

    .score-display {
      font-size: 48px;
      color: #D4AF37;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .quiz-locked {
      text-align: center;
      padding: 60px 20px;
      background: #1a1a2e;
      border: 2px dashed #666;
      border-radius: 10px;
    }

    .quiz-locked-icon {
      font-size: 72px;
      margin-bottom: 20px;
    }

    .quiz-locked h3 {
      color: #D4AF37;
      margin-bottom: 15px;
    }

    .feedback-message {
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .feedback-message.show {
      display: block;
    }

    .feedback-correct {
      background: rgba(81, 207, 102, 0.1);
      border: 1px solid #51cf66;
      color: #51cf66;
    }

    .feedback-incorrect {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <main style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
    <section class="quiz-container">

      <!-- Active Quiz -->
      <div id="quizActiveState" class="hidden">
        <div class="question-progress">
          <p style="margin-bottom: 10px; color: #D4AF37;">
            <strong id="progressText">Question 1 of 5</strong>
          </p>
          <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
          </div>
        </div>

        <div class="question-card">
          <div class="question-number" id="questionNumber">Question 1</div>
          <div class="question-text" id="questionText"></div>
          <div class="options" id="optionsContainer"></div>
          <div id="feedbackMessage" class="feedback-message"></div>
        </div>
      </div>

      <!-- Complete State -->
      <div id="quizCompleteState" class="hidden">
        <div class="quiz-complete">
          <h2>🎉 Quiz Complete!</h2>
          <div class="score-display" id="finalScore">0/5</div>
          <p>Congratulations! You've successfully answered all quiz questions.</p>
          <p style="color: #D4AF37; font-weight: 600; font-size: 18px;">All features unlocked!</p>
          <a href="index.html" class="btn btn-primary" style="display: inline-block; margin-top: 20px;">Return Dashboard</a>
        </div>
      </div>

      <div style="margin-top: 40px; text-align: center;">
        <p style="color: #999; font-size: 14px;">Your Team: <strong class="team-id-display">--</strong></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ABACUS Symposium. All rights reserved.</p>
    <p><span class="gold-text">🧠 Think • Learn • Unlock</span></p>
  </footer>

  <script src="quiz-app.js"></script>
  <script>
    // Quiz Questions
    const quizQuestions = [
      {
        id: 1,
        question: "In the CSS Box Model, if an element has <code>width: 200px</code>, <code>padding: 20px</code>, and <code>border: 5px</code>, what is the total rendered width if <code>box-sizing</code> is set to <code>content-box</code> (default)?",
        options: ["200px", "225px", "250px", "240px"],
        correctAnswer: 2 // C
      },
      {
        id: 2,
        question: "What will be printed by this code?<pre><code>&lt;input id=\"name\" value=\"Alice\"&gt;\nlet input = document.getElementById(\"name\");\ninput.innerText = \"Bob\";\nconsole.log(input.value);</code></pre>",
        options: [
          "Alice",
          "Bob",
          "undefined",
          "TypeError is thrown"
        ],
        correctAnswer: 0 // A
      },
      {
        id: 3,
        question: "When using the <code>defer</code> attribute on a script tag, when does the script execute relative to HTML parsing?",
        options: [
          "Immediately after the script is downloaded, pausing the parser.",
          "Asynchronously while the parser continues, and then immediately once downloaded.",
          "Only after the window.onload event has fired.",
          "After the document is fully parsed but before the DOMContentLoaded event."
        ],
        correctAnswer: 3 // D
      },
      {
        id: 4,
        question: "What is the output if the button is clicked once?<pre><code>const btn = document.getElementById(\"btn\");\n\nbtn.onclick = function() {\n  console.log(\"A\");\n};\n\nbtn.addEventListener(\"click\", function() {\n  console.log(\"B\");\n});\n\nbtn.onclick = function() {\n  console.log(\"C\");\n};</code></pre>",
        options: ["A B C", "C", "B C", "C B"],
        correctAnswer: 3 // D
      },
      {
        id: 5,
        question: "When you type <code>google.com</code> in your browser, DNS checks local cache/hosts first and then resolver hierarchy. Which final server holds the actual IP address for a specific domain?",
        options: ["Root Nameserver", "TLD Nameserver (.com)", "Authoritative Nameserver", "Gateway Router"],
        correctAnswer: 2 // C
      },

    ];

    let currentQuestion = 0;
    let answeredQuestions = {};
    let correctAnswersCount = 0;

    function getQuizStateKey() {
      var teamId = currentTeamId || sessionStorage.getItem('quizTeamId') || 'unknown';
      return 'quizState_' + String(teamId).toLowerCase();
    }

    function saveQuizState() {
      var state = {
        currentQuestion: currentQuestion,
        answeredQuestions: answeredQuestions,
        correctAnswersCount: correctAnswersCount
      };
      sessionStorage.setItem(getQuizStateKey(), JSON.stringify(state));
    }

    function saveQuizStateWithQuestion(nextQuestion) {
      var state = {
        currentQuestion: nextQuestion,
        answeredQuestions: answeredQuestions,
        correctAnswersCount: correctAnswersCount
      };
      sessionStorage.setItem(getQuizStateKey(), JSON.stringify(state));
    }

    function loadQuizState() {
      var raw = sessionStorage.getItem(getQuizStateKey());
      if (!raw) return;

      try {
        var parsed = JSON.parse(raw);
        if (typeof parsed.currentQuestion === 'number') {
          currentQuestion = parsed.currentQuestion;
        }
        if (parsed.answeredQuestions && typeof parsed.answeredQuestions === 'object') {
          answeredQuestions = parsed.answeredQuestions;
        }
        if (typeof parsed.correctAnswersCount === 'number') {
          correctAnswersCount = parsed.correctAnswersCount;
        }
      } catch (e) {
        console.error('Failed to load quiz state:', e);
      }

      if (currentQuestion < 0) currentQuestion = 0;
      if (currentQuestion > quizQuestions.length) currentQuestion = quizQuestions.length;
    }

    // Map each question to the feature it unlocks
    const questionToFeature = {
      0: 'eventsUnlocked',
      1: 'workshopsUnlocked',
      2: 'accommodationUnlocked',
      3: 'profileUnlocked',
      4: 'logoutUnlocked'
    };

    // Map feature names to display names
    const featureDisplayNames = {
      'eventsUnlocked': 'Events',
      'workshopsUnlocked': 'Workshops',
      'accommodationUnlocked': 'Accommodation',
      'profileUnlocked': 'Profile',
      'logoutUnlocked': 'Logout'
    };

    document.addEventListener('DOMContentLoaded', function() {
      loadQuizState();
      displayQuestion();
      updateQuizUI();
    });

    function updateQuizUI() {
      var activeState = document.getElementById('quizActiveState');
      var completeState = document.getElementById('quizCompleteState');

      activeState.classList.add('hidden');
      completeState.classList.add('hidden');

      if (currentQuestion >= quizQuestions.length) {
        document.getElementById('finalScore').textContent = correctAnswersCount + '/' + quizQuestions.length;
        saveQuizState();
        completeState.classList.remove('hidden');
      } else {
        activeState.classList.remove('hidden');
      }
    }

    function displayQuestion() {
      if (currentQuestion >= quizQuestions.length) {
        updateQuizUI();
        return;
      }

      const question = quizQuestions[currentQuestion];
      const progressPercent = ((currentQuestion) / quizQuestions.length) * 100;

      document.getElementById('questionNumber').textContent = `Question ${question.id}`;
      document.getElementById('questionText').innerHTML = question.question;
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
      document.getElementById('progressBar').style.width = progressPercent + '%';

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      question.options.forEach(function(option, index) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.textContent = String.fromCharCode(65 + index) + ') ' + option;
        button.disabled = answeredQuestions[currentQuestion] !== undefined;

        button.addEventListener('click', function() {
          handleAnswer(index, question.correctAnswer);
        });

        optionsContainer.appendChild(button);
      });
    }

    function handleAnswer(selectedIndex, correctIndex) {
      answeredQuestions[currentQuestion] = selectedIndex;
      const isCorrect = selectedIndex === correctIndex;
      const currentQuestionId = quizQuestions[currentQuestion].id;
      const featureToUnlock = questionToFeature[currentQuestion] || null;

      if (currentTeamId) {
        fetch(API_URL + '/submit-quiz-answer', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            team_id: currentTeamId,
            question_id: currentQuestionId,
            is_correct: isCorrect,
            feature_to_unlock: featureToUnlock
          })
        })
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          console.log('Quiz answer submitted:', data);
        })
        .catch(function(error) {
          console.error('Error submitting quiz answer:', error);
        });
      }

      const options = document.querySelectorAll('.option');
      const feedbackMessage = document.getElementById('feedbackMessage');

      options.forEach(function(btn, index) {
        btn.disabled = true;
        if (index === correctIndex) {
          btn.classList.add('correct');
        } else if (index === selectedIndex && selectedIndex !== correctIndex) {
          btn.classList.add('incorrect');
        }
      });

      feedbackMessage.classList.add('show');

      if (isCorrect) {
        correctAnswersCount++;
        feedbackMessage.classList.add('feedback-correct');
        feedbackMessage.classList.remove('feedback-incorrect');
        
        // Get feature name for display
        const featureDisplayName = featureDisplayNames[featureToUnlock];

        if (featureToUnlock && featureDisplayName) {
          feedbackMessage.textContent = '✅ Correct! ' + featureDisplayName + ' feature unlocked!';
        } else {
          feedbackMessage.textContent = '✅ Correct! Moving to next question.';
        }

        saveQuizStateWithQuestion(currentQuestion + 1);
        setTimeout(function() {
          currentQuestion++;
          saveQuizState();
          feedbackMessage.classList.remove('show');
          if (currentQuestion < quizQuestions.length) {
            displayQuestion();
          } else {
            updateQuizUI();
          }
        }, 2000);
      } else {
        feedbackMessage.classList.add('feedback-incorrect');
        feedbackMessage.classList.remove('feedback-correct');
        feedbackMessage.textContent = '❌ Sorry, wrong answer';

        saveQuizStateWithQuestion(currentQuestion + 1);
        setTimeout(function() {
          currentQuestion++;
          saveQuizState();
          feedbackMessage.classList.remove('show');
          if (currentQuestion < quizQuestions.length) {
            displayQuestion();
          } else {
            updateQuizUI();
          }
        }, 2000);
      }
    }
  </script>
</body>
</html>
